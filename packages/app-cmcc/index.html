<!doctype html>
<html lang="en" style="background-color: var(--v2-background-bg-deep, #fafafa)">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content, viewport-fit=cover"
    />
    <title>九天DeepInsight</title>
    <link rel="preload" as="image" href="/brand/startup-loading.svg" fetchpriority="high" />
    <link rel="preload" as="image" href="/src/assets/auth/startup-loading-background.webp" fetchpriority="high" />
    <link rel="stylesheet" href="/src/components/app-loading.css" />
    <link rel="icon" type="image/svg+xml" href="/brand/logo.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:image" content="/social-share.png" />
    <meta property="twitter:image" content="/social-share.png" />
    <!-- 首页指向落地页，须在任何模块脚本加载前重定向，主应用首页在 /app；用显式 index.html 避开 SPA fallback -->
    <script>
      if (location.pathname === "/") location.replace("/landing/index.html")
    </script>
    <script id="oc-theme-preload-script" src="/oc-theme-preload.js"></script>
  </head>
  <body class="antialiased overscroll-none text-12-regular overflow-hidden bg-v2-background-bg-deep">
    <noscript>
      <style>
        #app-startup-loading {
          display: none;
        }
      </style>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root" class="flex flex-col h-dvh bg-v2-background-bg-deep p-px">
      <div
        id="app-startup-loading"
        class="app-loading"
        data-component="app-loading"
        role="status"
        aria-label="系统加载中"
        aria-busy="true"
      >
        <div class="app-loading-scene" aria-hidden="true">
          <img
            class="app-loading-logo"
            src="/brand/startup-loading.svg"
            width="262"
            height="294"
            fetchpriority="high"
            alt=""
          />
          <p class="app-loading-title" aria-label="DeepInsight">
            <span>D</span><span>e</span><span>e</span><span>p</span><span>I</span><span>n</span><span>s</span
            ><span>i</span><span>g</span><span>h</span><span>t</span>
          </p>
          <div class="app-loading-dots"><span></span><span></span><span></span></div>
          <p class="app-loading-label" aria-label="系统加载中...">
            <span>系</span><span>统</span><span>加</span><span>载</span><span>中</span><span>...</span>
          </p>
        </div>
      </div>
    </div>
    <script src="/src/entry.tsx" type="module"></script>
  </body>
</html>
