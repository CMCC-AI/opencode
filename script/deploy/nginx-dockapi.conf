map $http_upgrade $dockapi_connection_upgrade {
  default upgrade;
  '' close;
}

log_format dockapi_no_args '$remote_addr [$time_local] '
                             '"$request_method $uri $server_protocol" '
                             '$status $body_bytes_sent "$http_user_agent"';

server {
  listen 3002;
  listen [::]:3002;
  server_name _;

  client_max_body_size 100m;
  access_log /var/log/nginx/dockapi_access.log dockapi_no_args;
  error_log /var/log/nginx/dockapi_error.log;

  location = / {
    return 302 /landing/index.html;
  }

  location ^~ /api/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    proxy_pass http://127.0.0.1:4096;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $dockapi_connection_upgrade;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
