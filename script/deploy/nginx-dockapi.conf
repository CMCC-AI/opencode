map $http_upgrade $dockapi_connection_upgrade {
  default upgrade;
  '' close;
}

map $uri $cmcc_static_cache {
  default "no-cache";
  "~^/assets/.+-[A-Za-z0-9_-]{8,}\\.[^/]+$" "public, max-age=31536000, immutable";
}

log_format dockapi_no_args '$remote_addr [$time_local] '
                             '"$request_method $uri $server_protocol" '
                             '$status $body_bytes_sent "$http_user_agent"';

server {
  listen 3002;
  listen [::]:3002;
  server_name _;

  client_max_body_size 100m;
  access_log /var/log/nginx/dockapi_access.log dockapi_no_args;
  error_log /var/log/nginx/dockapi_error.log;

  location = / {
    return 302 /landing/index.html;
  }

  # Static assets and the admin shell must remain available if the research process is down.
  # For custom OPENCODE_INSTALL_ROOT, update both paths below after installing the release.
  root /opt/opencode-cmcc/current/web;

  location = /admin {
    rewrite ^ /index.html last;
  }

  location ^~ /admin/ {
    rewrite ^ /index.html last;
  }

  location = /index.html {
    try_files $uri =503;
    include /opt/opencode-cmcc/current/web/admin-headers.conf;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control $cmcc_static_cache;
    add_header X-Content-Type-Options nosniff always;
  }

  location ~ ^/assets/.*\.mjs$ {
    types { }
    default_type application/javascript;
    try_files $uri =404;
    add_header Cache-Control $cmcc_static_cache;
    add_header X-Content-Type-Options nosniff always;
  }

  location ^~ /brand/ {
    try_files $uri =404;
    add_header Cache-Control no-cache;
    add_header X-Content-Type-Options nosniff always;
  }

  location = /apple-touch-icon-v3.png {
    try_files $uri =404;
    add_header Cache-Control no-cache;
  }

  location = /site.webmanifest {
    try_files $uri =404;
    default_type application/manifest+json;
    add_header Cache-Control no-cache;
  }

  location ^~ /api/internal/token-quota/ {
    return 404;
  }

  location ^~ /api/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-OpenCode-User-ID "";
    proxy_set_header X-DockAPI-Service-Token "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    proxy_pass http://127.0.0.1:4096;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-OpenCode-User-ID "";
    proxy_set_header X-DockAPI-Service-Token "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $dockapi_connection_upgrade;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
